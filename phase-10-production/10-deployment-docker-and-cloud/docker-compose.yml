# Phase 10 - Topic 10: app + postgres + redis, wired together on one network.
# Run from the repo root:  docker compose -f phase-10-production/10-deployment-docker-and-cloud/docker-compose.yml up --build
#
# Inside this network, containers reach each other by SERVICE NAME, not
# localhost - the app's DATABASE_URL/REDIS_URL below point at `postgres`/
# `redis`, which Docker Compose resolves as hostnames automatically.

services:
  app:
    build:
      context: ../..
      dockerfile: phase-10-production/10-deployment-docker-and-cloud/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
